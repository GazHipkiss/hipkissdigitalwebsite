<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Brum Brawl Ultimate</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;overscroll-behavior:none}
#shell{position:fixed;inset:0;display:grid;place-items:center;background:#05070b}
canvas{display:block;width:100vw;height:100vh;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0e16}
#ui{position:fixed;inset:0;pointer-events:none}
.controls{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end}
#stick{pointer-events:auto;position:relative;width:150px;height:150px;border-radius:50%;background:rgba(16,20,31,.55);border:2px solid rgba(255,255,255,.18);box-shadow:inset 0 0 0 18px rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35);touch-action:none}
#stick:before,#stick:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.08)}
#stick:before{width:2px;height:108px}#stick:after{width:108px;height:2px}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:linear-gradient(#4c5261,#242b37);border:2px solid rgba(255,255,255,.25);box-shadow:0 5px 14px rgba(0,0,0,.42);transform:translate(0,0)}
#label{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:800 10px monospace;opacity:.55;letter-spacing:.1em}
.acts{pointer-events:auto;display:flex;gap:14px;align-items:end}
.act{display:grid;place-items:center;border:2px solid rgba(255,255,255,.22);font-weight:1000;letter-spacing:.04em;color:#fff;user-select:none;-webkit-user-select:none;box-shadow:0 8px 20px rgba(0,0,0,.34)}
#jump{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#93b5ff,#2f5499);font-size:11px;margin-bottom:10px}
#kick{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b692ff,#573796);font-size:11px;margin-bottom:24px}
#punch{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8b98,#94283e);font-size:12px}
.act.on{transform:scale(.95);filter:brightness(1.18)}
#tapNote{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font:800 11px/1 monospace;letter-spacing:.08em;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);padding:6px 9px;border-radius:7px;opacity:.82;white-space:nowrap}
#msg{position:absolute;left:50%;top:90px;transform:translateX(-50%);font:900 18px monospace;color:#ffd85c;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.6);white-space:nowrap}
@media (orientation:portrait){canvas{height:auto;width:100vw}.controls{transform:scale(.84);transform-origin:bottom center}#msg{top:78px;font-size:15px}}
</style>
</head>
<body>
<div id="shell"><canvas id="game" width="960" height="540"></canvas></div>
<div id="ui">
  <div id="tapNote">BRUM BRAWL ULTIMATE · STREETS OF BIRMINGHAM</div>
  <div id="msg">MOVE · PUNCH · KICK · JUMP</div>
  <div class="controls">
    <div id="stick"><div id="knob"></div><div id="label">MOVE</div></div>
    <div class="acts">
      <div class="act" id="jump" data-action="jump">JUMP</div>
      <div class="act" id="kick" data-action="kick">KICK</div>
      <div class="act" id="punch" data-action="punch">PUNCH</div>
    </div>
  </div>
</div>
<script>
(()=>{
const c=document.getElementById('game'),g=c.getContext('2d');
g.imageSmoothingEnabled=false;
const W=960,H=540;
const msgEl=document.getElementById('msg');
const K={left:0,right:0,up:0,down:0};
let last=0,score=0,wave=0,combo=0,comboT=0,flash=0,shake=0;
let sparks=[],floating=[],pickups=[],stageClearTimer=0,gameWon=false,msgTimer=4;
const stages=[
  {name:'NEW STREET',title:'NEW STREET NIGHTS',bg1:'#0c1020',bg2:'#211830',brick:'#9a523d',road:'#17313a',accent:'#f0b53a',window:'#34d0ff',shop:['BALTI HOUSE','ARCADE','BAR']},
  {name:'DIGBETH',title:'DIGBETH NEON',bg1:'#130f20',bg2:'#261430',brick:'#8f3e47',road:'#26313f',accent:'#ff7d61',window:'#47f0aa',shop:['CUSTARD','WAREHOUSE','CAFE']},
  {name:'BULLRING',title:'BULLRING SHOWDOWN',bg1:'#08111e',bg2:'#1a2136',brick:'#60728b',road:'#203340',accent:'#ffd05a',window:'#8cc7ff',shop:['BULL','RING','BOSS']}
];
const P={x:170,y:420,z:0,vz:0,hp:100,lives:3,face:1,cool:0,state:'idle',stateT:0,walk:0,hurt:0,weapon:null,weaponUses:0};
let E=[];

// --- audio ---
let audioCtx=null,musicOn=false,musicStep=0,musicClock=0;
function ensureAudio(){
  if(!audioCtx){
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(Ctx) audioCtx=new Ctx();
  }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  musicOn=true;
}
function tone(freq,dur,type='square',vol=.03,delay=0){
  if(!audioCtx) return;
  const t=audioCtx.currentTime+delay;
  const o=audioCtx.createOscillator(),gn=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.005);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gn);gn.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02);
}
function sfxPunch(){tone(180,.05,'square',.045);tone(90,.07,'sawtooth',.03,.01)}
function sfxKick(){tone(120,.08,'square',.05);tone(70,.1,'triangle',.03,.01)}
function sfxJump(){tone(330,.04,'square',.03);tone(440,.08,'triangle',.025,.04)}
function sfxHit(){tone(80,.09,'sawtooth',.05);tone(42,.1,'triangle',.04,.02)}
function sfxPickup(){tone(660,.08,'square',.035);tone(880,.09,'square',.025,.08)}
function sfxStage(){tone(523,.12,'square',.03);tone(659,.12,'square',.03,.12);tone(784,.2,'square',.03,.24)}
function musicTick(dt){
  if(!musicOn || !audioCtx) return;
  musicClock-=dt;
  if(musicClock>0) return;
  musicClock=.22;
  const bass=[82,82,123,82,98,98,147,98];
  const lead=[330,392,440,392,330,392,523,392];
  const i=musicStep++%bass.length;
  tone(bass[i],.16,'square',.018);
  if(i%2===0) tone(lead[i],.1,'triangle',.012,.02);
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function R(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function T(t,x,y,col='#fff',size=16,align='left'){g.fillStyle=col;g.font='bold '+size+'px monospace';g.textAlign=align;g.fillText(t,x,y)}
function ellipse(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}
function poly(pts,col){g.fillStyle=col;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fill()}
function showMsg(t,sec=2){msgEl.textContent=t;msgTimer=sec;}

function stage(){return stages[Math.min(wave,stages.length-1)]}

function resetPlayerPosition(){P.x=170;P.y=420;P.z=0;P.vz=0;P.cool=0;P.state='idle';P.stateT=0;P.hurt=0;P.weapon=null;P.weaponUses=0;}

function spawnWave(){
  pickups=[];
  const idx=Math.min(wave,2);
  if(idx===0){
    E=[enemy(760,405,0),enemy(860,440,1),enemy(980,420,2)];
    pickups=[weaponPick(515,430,'bottle')];
  }else if(idx===1){
    E=[enemy(770,388,1),enemy(870,452,2),enemy(960,418,0),enemy(1080,440,1)];
    pickups=[weaponPick(470,428,'bat'),weaponPick(860,438,'pipe')];
  }else{
    E=[enemy(840,420,3,true)];
    pickups=[weaponPick(570,430,'pipe')];
  }
  showMsg(stage().title,2.4);
}
function enemy(x,y,type=0,boss=false){return{x,y,z:0,vz:0,type,boss,hp:boss?420:120,max:boss?420:120,face:-1,cool:.6+Math.random(),state:'idle',stateT:0,walk:0,hurt:0,dead:false,downTimer:0,gettingUp:0}}
function weaponPick(x,y,type){return{x,y,type,active:true}}

function backdrop(){
  const st=stage();
  const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,st.bg1);sky.addColorStop(.46,st.bg2);sky.addColorStop(1,'#12161d');g.fillStyle=sky;g.fillRect(0,0,W,H);
  R(0,0,W,74,'#303138');R(0,0,W,6,'#d6c521');R(0,68,W,6,'#d6c521');
  ellipse(850,55,23,23,'#f0e7ba');ellipse(842,50,18,18,'#d0cab3');
  R(0,74,W,180,'#13181f');
  for(let y=82;y<240;y+=26){for(let x=-((y/26)%2?0:18);x<W;x+=72){R(x,y,36,18,'#743529');R(x+2,y+2,32,14,st.brick);R(x+38,y,28,18,'#743529');R(x+40,y+2,24,14,st.brick)}}
  const off=-(Math.min(P.x-170,480)*.22)%340;
  for(let i=-1;i<4;i++){
    const bx=off+i*340;R(bx+30,124,170,110,'#2a190e');R(bx+34,128,162,102,'#2d3a40');R(bx+30,114,170,10,'#8c460c');for(let l=0;l<9;l++)ellipse(bx+42+l*17,119,4,4,'#ffb94c');R(bx+220,124,82,110,'#162128');R(bx+220,114,82,10,'#8c460c');for(let l=0;l<4;l++)ellipse(bx+232+l*17,119,4,4,'#ffb94c');for(let q=0;q<4;q++)R(bx+58+q*30,145+q*8,44,3,st.window);T(st.shop[i%3],bx+262,106,st.accent,20,'center')
  }
  for(let x=-20-((Math.min(P.x-170,480))*.3%250);x<W+40;x+=250){R(x,104,10,260,'#67757d');R(x+2,86,6,22,'#84949c');R(x+10,86,42,8,'#84949c');ellipse(x+49,90,12,10,'#d3d89a')}
  R(360,90,250,30,'#1a1b28');for(let i=0;i<3;i++){const cx=390+i*98;ellipse(cx,105,28,22,'#643a95');ellipse(cx,105,22,16,'#222733');R(cx-1,94,2,12,'#4ee267');R(cx+10,105,2,9,'#4ee267')}T(st.name,480,124,st.accent,28,'center');
  R(0,254,W,150,st.road);for(let y=258;y<402;y+=12){for(let x=-((y/12)%2?0:12);x<W;x+=24){R(x,y,18,2,'#2d5661');R(x+4,y+5,18,2,'#234a54')}}R(0,404,W,136,'#1a1d22');
  poly([[540,506],[580,456],[712,456],[760,490],[950,490],[958,540],[480,540]], '#0b0d10');R(590,465,105,20,'#1a2a33');R(700,465,45,20,'#1a2a33');R(616,487,15,5,'#97332e');
  R(60,210,36,72,'#5a7078');ellipse(78,208,18,8,'#80949a');R(8,350,50,34,'#9a1f24');R(15,363,36,6,'#d9d9d9');R(92,118,38,9,st.accent);T('0121',111,125,'#20313b',8,'center');
  if(Math.min(wave,2)===1){R(784,320,70,12,'#ffb3aa');T('CUSTARD',819,330,'#2a1321',10,'center')}
  if(Math.min(wave,2)===2){ellipse(780,250,60,34,'#b5bcc8');for(let yy=228;yy<273;yy+=10)for(let xx=734;xx<827;xx+=12)ellipse(xx,yy,3,3,'#6a7382')}
}

function palette(o,hero){
  if(hero)return{skin:'#d7a27e',skin2:'#bf8460',hair:'#3b241c',shirt:'#f1b52c',shirt2:'#e48516',pants:'#44474e',pants2:'#2a2d33',shoe:'#14161a',line:'#111',lip:'#753530'};
  if(o.boss)return{skin:'#d39b78',skin2:'#ad7053',hair:'#d9c79f',shirt:'#e8e9ef',shirt2:'#b7bbca',pants:'#3b61d7',pants2:'#2d49a6',shoe:'#c53c2f',line:'#111',lip:'#6f332d'};
  if(o.type===1)return{skin:'#c28765',skin2:'#9f6247',hair:'#c24f21',shirt:'#3a7eac',shirt2:'#25526f',pants:'#2f5d8a',pants2:'#223f5d',shoe:'#c68143',line:'#111',lip:'#6f332d'};
  if(o.type===2)return{skin:'#a86d54',skin2:'#84523f',hair:'#19191b',shirt:'#516073',shirt2:'#35404d',pants:'#284860',pants2:'#1c3242',shoe:'#8a5f37',line:'#111',lip:'#613029'};
  return{skin:'#bd815f',skin2:'#97593e',hair:'#c24f21',shirt:'#5071aa',shirt2:'#334a72',pants:'#2b5a8a',pants2:'#21446a',shoe:'#c68143',line:'#111',lip:'#6f332d'};
}

function drawWeaponHeld(type){
  if(type==='bottle'){R(44,-91,7,20,'#7ae7ef');R(46,-96,3,5,'#e8faff');}
  if(type==='bat'){R(40,-98,10,45,'#9a6a38');R(42,-54,6,6,'#dcb08a');}
  if(type==='pipe'){R(40,-96,11,48,'#aeb5bc');R(42,-49,7,6,'#d5d8de');}
}

function fighter(o,hero=false){
  const p=palette(o,hero),state=o.state,bob=(state==='walk'&&Math.floor(o.walk)%2)?2:0,boss=o.boss;
  const px=o.x,py=o.y-o.z;g.save();g.translate(Math.round(px),Math.round(py));if(o.face<0)g.scale(-1,1);const scale=boss?1.16:1;g.scale(scale,scale);ellipse(0,6,boss?30:24,boss?7:5,'rgba(0,0,0,.35)');
  let ldx=0,rdx=0;if(state==='walk'){const ph=Math.floor(o.walk)%4;ldx=[-5,0,5,0][ph];rdx=-ldx}
  const downPose=o.dead||o.state==='down';
  if(downPose){
    g.strokeStyle=p.pants2;g.lineWidth=16;g.lineCap='round';g.beginPath();g.moveTo(-8,-38);g.lineTo(-30,-15);g.stroke();g.strokeStyle=p.pants;g.beginPath();g.moveTo(9,-38);g.lineTo(32,-16);g.stroke();g.strokeStyle=p.shoe;g.lineWidth=10;g.beginPath();g.moveTo(-30,-15);g.lineTo(-42,-12);g.stroke();g.beginPath();g.moveTo(32,-16);g.lineTo(45,-13);g.stroke();poly([[-28,-90],[-2,-106],[34,-82],[7,-58]],p.shirt);poly([[-20,-82],[-2,-96],[22,-84],[7,-70]],p.shirt2);R(-32,-104,26,26,p.skin);R(-32,-111,26,8,p.hair);R(-26,-95,4,4,'#111');R(-16,-92,8,2,p.lip);g.restore();return;
  }
  // getting up pose
  if(o.state==='getup'){
    g.strokeStyle=p.pants2;g.lineWidth=14;g.lineCap='round';g.beginPath();g.moveTo(-16,-38);g.lineTo(-20,-12);g.stroke();g.strokeStyle=p.pants;g.beginPath();g.moveTo(6,-38);g.lineTo(18,-5);g.stroke();poly([[-26,-88],[18,-94],[23,-46],[-20,-42]],p.shirt);R(-14,-132,28,28,p.skin);R(-14,-139,28,8,p.hair);R(-8,-122,4,4,'#111');R(4,-122,4,4,'#111');R(-4,-114,8,2,p.lip);g.restore();return;
  }
  g.strokeStyle=p.pants2;g.lineWidth=boss?16:14;g.lineCap='round';g.beginPath();g.moveTo(-10,-30+bob);g.lineTo(-14+ldx,-2);g.stroke();g.strokeStyle=p.pants;g.beginPath();g.moveTo(12,-30+bob);g.lineTo(16+rdx,-2);g.stroke();g.strokeStyle=p.shoe;g.lineWidth=9;g.beginPath();g.moveTo(-14+ldx,-2);g.lineTo(-28+ldx,0);g.stroke();g.beginPath();g.moveTo(16+rdx,-2);g.lineTo(30+rdx,0);g.stroke();
  poly([[-24,-94+bob],[24,-94+bob],[28,-40+bob],[-28,-40+bob]],p.shirt);poly([[-16,-82+bob],[11,-82+bob],[14,-42+bob],[-18,-42+bob]],p.shirt2);
  const punch=state==='punch',kick=state==='kick',jump=state==='jump',weapon=state==='weapon';
  g.strokeStyle=p.shirt2;g.lineWidth=boss?14:12;g.beginPath();g.moveTo(-22,-84+bob);g.lineTo(jump?-35:-33,jump?-93:-58+bob);g.stroke();
  g.strokeStyle=p.shirt;g.beginPath();g.moveTo(22,-84+bob);g.lineTo((punch||weapon)?46:(jump?39:35),(punch||weapon)?-84:(jump?-96:-58+bob));g.stroke();ellipse(jump?-35:-33,jump?-93:-56+bob,7,7,p.skin);ellipse((punch||weapon)?48:(jump?39:35),(punch||weapon)?-84:(jump?-96:-56+bob),7,7,p.skin);
  if(kick){g.strokeStyle=p.pants;g.lineWidth=15;g.beginPath();g.moveTo(10,-30);g.lineTo(52,-40);g.stroke();g.strokeStyle=p.shoe;g.lineWidth=9;g.beginPath();g.moveTo(52,-40);g.lineTo(65,-37);g.stroke()}
  if(hero && P.weapon && weapon) drawWeaponHeld(P.weapon);
  if(!hero && o.boss && weapon){R(42,-94,10,48,'#aeb5bc')}
  R(-7,-108+bob,14,16,p.skin2);R(-17,-140+bob,34,34,p.skin);R(-17,-147+bob,34,10,p.hair);R(-17,-136+bob,7,14,p.hair);R(10,-136+bob,7,10,p.hair);R(-9,-129+bob,5,5,'#fff');R(5,-129+bob,5,5,'#fff');R(-7,-129+bob,3,5,'#111');R(5,-129+bob,3,5,'#111');R(-10,-133+bob,6,2,p.line);R(4,-133+bob,6,2,p.line);R(-1,-126+bob,3,9,p.skin2);R(-6,-116+bob,12,2,p.lip);if(hero||o.type===2)R(-11,-118+bob,22,7,'#492c25');if(hero){R(-5,-83+bob,10,14,'#fff59e');R(0,-69+bob,4,6,'#ff7f0f')}if(o.hurt>0){g.fillStyle='rgba(255,255,255,.45)';g.fillRect(-38,-155,80,160)}
  g.restore();
}

function drawPickup(w){
  if(!w.active) return;
  ellipse(w.x,w.y+8,18,5,'rgba(0,0,0,.3)');
  if(w.type==='bottle'){R(w.x-6,w.y-24,12,28,'#7ae7ef');R(w.x-2,w.y-30,4,8,'#e8faff');}
  if(w.type==='bat'){R(w.x-4,w.y-34,8,42,'#9a6a38');R(w.x-2,w.y+6,4,6,'#dcb08a');}
  if(w.type==='pipe'){R(w.x-5,w.y-32,10,40,'#b4bcc4');R(w.x-3,w.y+6,6,5,'#d8dde2');}
}

function hitSpark(x,y){for(let i=0;i<10;i++)sparks.push({x,y,vx:(Math.random()-.5)*180,vy:-60-Math.random()*160,t:.22+Math.random()*.18})}
function popText(txt,x,y,col){floating.push({txt,x,y,t:.6,col})}

function nearbyPickup(){
  for(const w of pickups){if(w.active && Math.abs(P.x-w.x)<36 && Math.abs(P.y-w.y)<22) return w;}
  return null;
}
function pickupWeapon(){
  const w=nearbyPickup();
  if(!w) return false;
  P.weapon=w.type;P.weaponUses=w.type==='bottle'?3:w.type==='bat'?8:6;w.active=false;sfxPickup();showMsg('PICKED UP '+w.type.toUpperCase(),1.2);return true;
}

function attack(type){
  ensureAudio();
  if(P.cool>0||P.hurt>0) return;
  if(type==='punch' && nearbyPickup() && !P.weapon) pickupWeapon();
  P.state=type; P.stateT=0;
  if(type==='punch') {P.cool=.24; sfxPunch();}
  if(type==='kick') {P.cool=.36; sfxKick();}
  if(type==='jump'){ P.cool=.45; if(P.z<=0){P.vz=310; sfxJump();} }
  if(type==='punch' && P.weapon){P.state='weapon';P.cool=.34;}

  let reach=0,dmg=0,knock=false;
  if(P.state==='weapon'){reach=P.weapon==='bat'?92:P.weapon==='pipe'?86:78; dmg=P.weapon==='bat'?44:P.weapon==='pipe'?40:36; knock=true;}
  else if(type==='punch'){reach=60; dmg=24;}
  else if(type==='kick'){reach=78; dmg=36; knock=true;}
  else if(type==='jump'){reach=50; dmg=10;}

  E.forEach(e=>{
    if(e.dead || e.state==='down') return;
    const dx=e.x-P.x,dy=Math.abs(e.y-P.y);
    if((type!=='jump') && Math.sign(dx||P.face)===P.face && Math.abs(dx)<reach && dy<32){
      e.hp-=dmg; e.hurt=.18; e.x+=P.face*(knock?30:14); combo++; comboT=1.1; score+=100*combo; flash=.05; shake=.1; hitSpark(e.x,e.y-100); popText(String(dmg),e.x,e.y-130,'#ffd25e'); sfxHit();
      if(knock && e.hp>0){e.state='down';e.downTimer=1.2;e.stateT=0;}
      if(e.hp<=0){e.dead=true;e.state='down';e.downTimer=1.1;score+=e.boss?3500:500;popText('KO',e.x,e.y-145,'#ff6a6a');}
    }
  });

  if(P.state==='weapon' && P.weapon){
    P.weaponUses--; if(P.weaponUses<=0){const old=P.weapon;P.weapon=null;showMsg(old.toUpperCase()+' BROKE',1);}
  }
}

function update(dt){
  musicTick(dt);
  if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)msgEl.textContent=P.weapon?('WEAPON: '+P.weapon.toUpperCase()+' x'+P.weaponUses):'MOVE · PUNCH · KICK · JUMP';}
  P.cool=Math.max(0,P.cool-dt);P.hurt=Math.max(0,P.hurt-dt);P.stateT+=dt;comboT-=dt;if(comboT<=0)combo=0;
  const mx=K.right-K.left,my=K.down-K.up;if(mx)P.face=mx>0?1:-1;
  if(P.z>0||P.vz>0){P.state='jump';P.z+=P.vz*dt;P.vz-=620*dt;if(P.z<=0){P.z=0;P.vz=0;if(Math.abs(mx)+Math.abs(my)>0)P.state='walk';else P.state='idle';}}
  if(P.state==='punch'&&P.stateT>.18){P.state='idle';P.stateT=0}
  if(P.state==='kick'&&P.stateT>.28){P.state='idle';P.stateT=0}
  if(P.state==='weapon'&&P.stateT>.24){P.state='idle';P.stateT=0}
  if((P.state==='idle'||P.state==='walk')&&P.z<=0){if(mx||my){P.state='walk';P.walk+=dt*11;const len=Math.hypot(mx,my)||1;P.x=clamp(P.x+(mx/len)*138*dt,85,690);P.y=clamp(P.y+(my/len)*92*dt,386,468)}else P.state='idle'}

  for(const e of E){
    e.cool=Math.max(0,e.cool-dt);e.hurt=Math.max(0,e.hurt-dt);e.stateT+=dt;
    if(e.dead){e.downTimer-=dt;continue;}
    if(e.state==='down'){e.downTimer-=dt;if(e.downTimer<=0){e.state='getup';e.stateT=0;}continue;}
    if(e.state==='getup'){if(e.stateT>.5){e.state='idle';e.stateT=0;}continue;}
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;e.face=dx>0?1:-1;
    if(e.hurt>0){e.state='hurt';continue}
    if(d>45){e.state='walk';e.walk+=dt*8.5;const sp=e.boss?60:50;e.x+=dx/d*sp*dt;e.y+=dy/d*sp*.65*dt}
    else{e.state='idle';if(e.cool<=0&&P.z<=10){e.cool=e.boss?.78:1.02+Math.random()*.28;e.state=e.boss?'weapon':'punch';P.hp-=e.boss?18:9;P.hurt=.2;P.x-=e.face*10;flash=.04;shake=.1;popText('-'+(e.boss?18:9),P.x,P.y-130,'#ff7e7e');sfxHit();if(e.boss && Math.random()>.5){P.state='down';P.stateT=0;P.z=0;P.vz=0;}}}
  }

  if(P.state==='down'){P.stateT+=dt;if(P.stateT>.6){P.state='idle';P.stateT=0;}}
  E=E.filter(e=>!(e.dead && e.downTimer<=0));
  if(P.hp<=0){P.lives--; if(P.lives<0) P.lives=0; P.hp=100; resetPlayerPosition(); showMsg('GET UP!',1.6);}
  const liveEnemies=E.filter(e=>!e.dead).length;
  if(liveEnemies===0 && !gameWon){
    if(stageClearTimer<=0){stageClearTimer=2.2;showMsg('STAGE CLEAR',2);sfxStage();}
  }
  if(stageClearTimer>0){stageClearTimer-=dt;if(stageClearTimer<=0){wave++; if(wave>=stages.length){gameWon=true;showMsg('BIRMINGHAM IS YOURS',4);} else {spawnWave();}}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=440*dt;s.t-=dt;if(s.t<=0)sparks.splice(i,1)}
  for(let i=floating.length-1;i>=0;i--){const f=floating[i];f.y-=40*dt;f.t-=dt;if(f.t<=0)floating.splice(i,1)}
  flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);
}

function drawHUD(){
  T('1UP',38,28,'#d5d6dc',18);T(String(score).padStart(6,'0'),110,28,'#d5d6dc',18);R(24,34,190,12,'#8e1717');R(24,34,190*P.hp/100,12,'#d22d1b');T('x'+P.lives,220,47,'#d5d6dc',18);
  T('TIME',472,18,'#d5d6dc',16,'center');T(String(Math.max(1,28-wave*6)).padStart(2,'0'),480,49,'#d5d6dc',36,'center');
  T('STAGE',770,28,'#d5d6dc',18);T(String(wave+1),862,28,'#d5d6dc',18);R(744,34,170,12,'#1a2946');R(744,34,170,12,'#223d63');T(stage().name,829,47,'#d5d6dc',12,'center');
  if(combo>1)T(combo+' HIT',478,68,'#ffd35e',18,'center');
  if(P.weapon) T(P.weapon.toUpperCase()+' x'+P.weaponUses,478,88,'#a7f7ff',14,'center');
  if(wave===2 && E.length){const boss=E[0];R(290,72,380,20,'rgba(0,0,0,.72)');R(310,80,340,7,'#41252b');R(310,80,340*(boss.hp/boss.max),7,'#dc3748');T('BULLRING BRUISER',480,78,'#fff',12,'center');}
  if(gameWon){R(318,205,324,78,'rgba(0,0,0,.7)');T('STAGE CLEAR',480,246,'#ffd35e',28,'center');T('BIRMINGHAM IS YOURS',480,272,'#fff',17,'center')}
}
function drawEffects(){for(const s of sparks)R(s.x,s.y,6,6,Math.random()>.5?'#fff3a3':'#ffa443');for(const f of floating)T(f.txt,f.x,f.y,f.col,16,'center')}
function draw(){g.save();if(shake>0)g.translate((Math.random()-.5)*7,(Math.random()-.5)*4);backdrop();for(const w of pickups)drawPickup(w);[...E,P].sort((a,b)=>a.y-b.y).forEach(o=>fighter(o,o===P));drawEffects();drawHUD();if(flash>0){g.fillStyle='rgba(255,255,255,.12)';g.fillRect(0,0,W,H)}g.restore()}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
spawnWave();requestAnimationFrame(loop);

// keyboard
const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};
addEventListener('keydown',e=>{if(map[e.key]){K[map[e.key]]=1;e.preventDefault()}if((e.key==='j'||e.key==='J')&&!e.repeat){attack('punch');e.preventDefault()}if((e.key==='k'||e.key==='K')&&!e.repeat){attack('kick');e.preventDefault()}if((e.key==='l'||e.key==='L')&&!e.repeat){attack('jump');e.preventDefault()}});
addEventListener('keyup',e=>{if(map[e.key]){K[map[e.key]]=0;e.preventDefault()}});
// stick
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickPointer=null;
function setStick(cx,cy){const r=stick.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height/2;let dx=cx-ox,dy=cy-oy,max=r.width*.31,dist=Math.hypot(dx,dy)||1;if(dist>max){dx=dx/dist*max;dy=dy/dist*max}knob.style.transform='translate('+dx+'px,'+dy+'px)';const nx=dx/max,ny=dy/max,dead=.22;K.left=nx<-dead?1:0;K.right=nx>dead?1:0;K.up=ny<-dead?1:0;K.down=ny>dead?1:0}
function releaseStick(){stickPointer=null;K.left=K.right=K.up=K.down=0;knob.style.transform='translate(0,0)'}
stick.addEventListener('pointerdown',e=>{ensureAudio();e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e.clientX,e.clientY)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer){e.preventDefault();setStick(e.clientX,e.clientY)}});
stick.addEventListener('pointerup',e=>{if(e.pointerId===stickPointer){e.preventDefault();releaseStick()}});
stick.addEventListener('pointercancel',releaseStick);
// buttons
document.querySelectorAll('[data-action]').forEach(b=>{const act=b.dataset.action;const down=e=>{ensureAudio();e.preventDefault();b.classList.add('on');attack(act)};const up=e=>{e.preventDefault();b.classList.remove('on')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
})();
</script>
